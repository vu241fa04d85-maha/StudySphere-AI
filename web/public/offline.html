<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — AI Study Assistant</title>
  <style>
    body {
      background-color: #0A0E17;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #818CF8;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 20px;
    }
    h1 { margin: 0 0 10px 0; font-size: 24px; }
    p { color: #94A3B8; font-size: 14px; max-width: 400px; line-height: 1.6; }
    .btn {
      margin-top: 24px;
      padding: 10px 20px;
      background: #6366F1;
      color: #FFF;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="badge">AI-SA Offline Notice</div>
  <h1>No Internet Connection</h1>
  <p>AI Study Assistant cloud services (live AI chat, database sync, and submissions) require active network connectivity. Cached notes and previously opened screens remain accessible.</p>
  <button class="btn" onclick="window.location.reload()">Retry Connection</button>
</body>
</html>
